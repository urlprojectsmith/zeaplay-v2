services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zea_play
      POSTGRES_USER: zea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zea_password}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zea -d zea_play']
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: zea
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-zea_password}
      POSTGRESQL_DATABASE: zea_play
      PGBOUNCER_DATABASE: zea_play
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - '127.0.0.1:6432:6432'
    restart: unless-stopped
    networks:
      - zea-play
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -ec "</dev/tcp/127.0.0.1/6432"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-realtime:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6381:6379'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - redis-realtime-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-rate-limit:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6382:6379'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - redis-rate-limit-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zea-play-dev-minio-access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zea-play-dev-minio-secret-at-least-32-chars}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
      - zea-play
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/zea-play-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zea-play-dev-minio-access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zea-play-dev-minio-secret-at-least-32-chars}

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped
    networks:
      - zea-play
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - '127.0.0.1:9090:9090'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - '127.0.0.1:3001:3000'
    restart: unless-stopped
    networks:
      - zea-play
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-cache-data:
  redis-queue-data:
  redis-realtime-data:
  redis-rate-limit-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  zea-play:
    driver: bridge
