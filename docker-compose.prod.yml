name: zeaplay-prod-app

services:
  zeaplay-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    image: zeaplay-api:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_PORT: '7111'
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      DIRECT_DATABASE_URL: ${DOCKER_DIRECT_DATABASE_URL:-${DIRECT_DATABASE_URL}}
      REDIS_CACHE_URL: ${DOCKER_REDIS_CACHE_URL:-${REDIS_CACHE_URL}}
      REDIS_QUEUE_URL: ${DOCKER_REDIS_QUEUE_URL:-${REDIS_QUEUE_URL}}
      REDIS_REALTIME_URL: ${DOCKER_REDIS_REALTIME_URL:-${REDIS_REALTIME_URL}}
      REDIS_RATE_LIMIT_URL: ${DOCKER_REDIS_RATE_LIMIT_URL:-${REDIS_RATE_LIMIT_URL}}
    ports:
      - '127.0.0.1:7211:7111'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - zeaplay-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:7111/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  zeaplay-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-https://api.play.zeacrm.com/api/v1}
        NEXT_PUBLIC_CANONICAL_APP_URL: ${DOCKER_NEXT_PUBLIC_CANONICAL_APP_URL:-https://play.zeacrm.com}
    image: zeaplay-web:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: '7100'
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-https://api.play.zeacrm.com/api/v1}
      NEXT_PUBLIC_CANONICAL_APP_URL: ${DOCKER_NEXT_PUBLIC_CANONICAL_APP_URL:-https://play.zeacrm.com}
    ports:
      - '127.0.0.1:7200:7100'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - zeaplay-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:7100/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  zeaplay-network:
    driver: bridge
