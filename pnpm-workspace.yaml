packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  'esbuild': true
  'msgpackr-extract': true
  'prisma': true

overrides:
  vite: '>=6.4.3'
  postcss: '>=8.5.18'
  deepmerge-ts: '>=8.0.0'
  multer: '>=2.3.0'
  decode-uri-component: '>=0.4.3'
  brace-expansion@<1.1.20: 1.1.20
  brace-expansion@>=2.0.0 <2.1.6: 2.1.6
  brace-expansion@>=4.0.0 <5.0.11: 5.0.11
  stream-json: '>=3.4.1'
  minio@8.0.7>stream-json: 1.9.1
