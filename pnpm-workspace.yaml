packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: set this to true or false
  'esbuild': true
  'msgpackr-extract': true
  'prisma': true

overrides:
  vite: '>=6.4.3'
  postcss: '>=8.5.18'
  deepmerge-ts: '>=8.0.0'
  multer: '>=2.3.0'
  decode-uri-component: '>=0.4.3'
  stream-json: '>=3.4.1'
